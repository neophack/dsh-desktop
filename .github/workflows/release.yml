name: Release

# A manual, full-pipeline release: run the complete headless gate (`yarn check`), then the
# Windows package gate and the unsigned NSIS installer plus portable archive builds on a real
# Windows runner, and publish a GitHub Release carrying both Windows artifacts.
#
# The signed macOS release stays a separate manual step (`dist:mac` on a credentialed machine);
# this workflow never touches signing secrets.
#
# Trigger it from the Actions tab ("Release" → "Run workflow") or with:
#
#   gh workflow run release.yml -f version=v2.0.5
#
# The tag defaults to the version in dsh-plugin-desktop/package.json; pass `version` to override
# (the package version is bumped to match, so the artifact names and the tag never disagree).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (defaults to dsh-plugin-desktop/package.json, e.g. v2.0.5)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  # Creating the release (tag, notes, assets) is the one thing this workflow does beyond CI.
  contents: write

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # The complete headless gate: build, typecheck, unit tests, and every headless smoke.
  # A release is only made when all of it passes.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn check

  # Windows-only logic, the package gate, and both unsigned artifacts. The version bump runs
  # before the build so the artifact filenames carry exactly the tag being released.
  build-windows:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - name: Resolve the release tag
        id: tag
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="v$(node -p "require('./dsh-plugin-desktop/package.json').version")"
          fi
          case "$VERSION" in
            v*) ;;
            *)  VERSION="v$VERSION" ;;
          esac
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

          # Keep the packaged version and the tag in agreement when an override was given.
          PKG_VERSION="${VERSION#v}"
          if [ "$(node -p "require('./dsh-plugin-desktop/package.json').version")" != "$PKG_VERSION" ]; then
            (cd dsh-plugin-desktop && npm pkg set version="$PKG_VERSION")
            echo "dsh-plugin-desktop/package.json bumped to $PKG_VERSION to match the tag"
          fi
      - run: yarn install --immutable
      - run: yarn workspace dsh-plugin-desktop check:win-package
      - name: Build Windows installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:win
      - name: Build Windows portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:win-portable
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows
          path: |
            dsh-plugin-desktop/dist/*-Setup.exe
            dsh-plugin-desktop/dist/*-Portable.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [check, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-windows
          path: release-assets

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag }}
          name: DSH Desktop ${{ needs.build-windows.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*
